name: Hybrid checks
on:
  pull_request:
  push:
    branches: [staging, electron]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e ".[legacy]"
      - run: npm ci
      - run: python -m compileall -q src
      - run: python scripts/backend_test.py
      - run: python scripts/smoke_test.py
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-verification
          path: test-results/
          if-no-files-found: ignore
