name: Release

# Builds and publishes Bidoytu for Windows and Linux.
#
# Two trigger paths:
#
#   1. Push to `main`         -> rolling PRE-RELEASE tagged "latest", overwritten
#                                each time. Gives a single "download the current
#                                build" link without a release per commit.
#
#   2. Push a version tag     -> a real, permanent release. Tag with the
#      (e.g. v1.0.0)             pattern `v*`; the release is named after the tag
#                                (e.g. "Bidoytu v1.0.0") and is NOT a pre-release.
#
# To cut version 1.0.0:
#     git tag v1.0.0
#     git push origin v1.0.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Only one release build per ref at a time; newer pushes cancel in-flight ones.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to create/update GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bidoytu-windows
          - os: ubuntu-latest
            asset: bidoytu-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # PyInstaller's analysis cache is OS-specific, so keep separate caches
      # for Windows and Linux. The source/config hash prevents stale analysis
      # from being reused after a build-relevant change.
      - name: Cache PyInstaller analysis
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('packaging/bidoytu.spec', 'pyproject.toml', 'requirements.txt', 'src/**/*.py', 'src/**/*.png', 'src/**/*.ico') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      # PySide6 apps need X/GL system libraries present at build time so
      # PyInstaller can discover and bundle the Qt runtime dependencies.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install project + build tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary -e ".[dev]"

      # Use bash on every OS (Git Bash ships on the Windows runner). PowerShell
      # treats PyInstaller's INFO logging on stderr as a failure and exits 1
      # even on a successful build; bash keys off the real exit code instead.
      # `python -m PyInstaller` avoids depending on the Scripts dir being on PATH.
      - name: Build with PyInstaller
        shell: bash
        run: python -m PyInstaller packaging/bidoytu.spec --noconfirm

      # PyInstaller's COLLECT step writes a "bidoytu" folder under dist/.
      # Zip it so the release carries a single downloadable artifact per OS.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bidoytu/* -DestinationPath "${{ matrix.asset }}.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist/bidoytu
          zip -r "../../${{ matrix.asset }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          retention-days: 7
          # The release file is already compressed; skip a second compression
          # pass when upload-artifact packages it for transfer.
          compression-level: 0

  # Publishes a permanent release when a v* tag is pushed.
  release-tagged:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Bidoytu ${{ github.ref_name }}"
          body: |
            Bidoytu ${{ github.ref_name }}

            Downloads:
            - **Windows**: `bidoytu-windows.zip`
            - **Linux**: `bidoytu-linux.zip`

            Unzip and run the `bidoytu` executable inside.
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*.zip

  # Publishes/overwrites the rolling "latest" pre-release on pushes to main.
  release-rolling:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish rolling "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (main-${{ github.run_number }}-${{ github.sha }})"
          body: |
            Automated build from the latest commit on `main`.

            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}

            This pre-release is overwritten on every push to `main`.
            For stable downloads, use a versioned release (e.g. v1.0.0).
          prerelease: true
          files: artifacts/**/*.zip

  # Publishes the Python package to PyPI on a v* tag, using PyPI Trusted
  # Publishing (OIDC) - no API token or secret is stored in the repo.
  #
  # One-time setup on PyPI (see packaging/build_release.md):
  #   pypi.org -> project "bidoytu" -> Publishing -> add a GitHub trusted
  #   publisher: owner "Bidoytu", repo "Bidoytu", workflow "main.yml",
  #   environment "pypi".
  #
  # Runs only on tags, never on main or staging pushes.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bidoytu/
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version: $PKG_VERSION | Tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION. Bump the version before tagging."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
