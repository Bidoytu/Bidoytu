[project]
name = "bidoytu"
version = "0.1.0"
description = "An intercepting HTTP proxy tool built with PySide6 and mitmproxy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "mitmproxy>=11.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]

[project.scripts]
bidoytu = "bidoytu.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
bidoytu = ["assets/*.png"]
